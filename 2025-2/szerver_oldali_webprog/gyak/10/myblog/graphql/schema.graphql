# A "" egy API dokumentációs eszköz, amely lehetővé teszi a GraphQL API-k leírását és dokumentálását.
# A # jelölés komment, amelyet a GraphQL figyelmen kívül hagy, míg a "..." leírás, amely a séma része és megjelenik az API dokumentációban. Kliensnek szól, míg a # a fejlesztőnek.
# A következő kód egy GraphQL sémát definiál, amely egy egyszerű felhasználói rendszert modellez.

"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."

# A @scalar direktíva  egyéni skalár típus definiálására szolgál, amely ebben az esetben egy DateTime formátumot jelöl.
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
# A Query típus a GraphQL séma gyökerét jelenti, ahol a lekérdezések kezdődnek. Itt definiáljuk, hogy milyen lekérdezéseket lehet végrehajtani az API-n keresztül.
type Query {
    "Find a single user by an identifying attribute."
    # A user mező lehetővé teszi egyetlen felhasználó keresését azonosító attribútum alapján, például ID vagy email cím.
    # A @eq direktíva azt jelenti, hogy a keresés egyenlőség alapján történik, míg a @rules direktíva szabályokat alkalmaz a bemeneti értékekre, például kötelező mezők vagy kizáró feltételek.
    user(
      "Search by primary key."
      # @eq direktíva azt jelenti, hogy a keresés egyenlőség alapján történik, míg a @rules direktíva szabályokat alkalmaz a bemeneti értékekre, például kötelező mezők vagy kizáró feltételek.
      # A prohibits:email szabály azt jelenti, hogy ha az id mező meg van adva, akkor az email mező nem lehet megadva, és fordítva. A required_without szabály pedig azt jelenti, hogy legalább az egyik mezőnek kötelezően meg kell lennie. A user lekérdezésnél vagy id alapján keresel, vagy email alapján, de egyszerre a kettőt nem.
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
       # a lekérdezés eredménye egy User, a @find direktíva azt mondja a Lighthouse-nak, hogy a megadott feltétel alapján egyetlen rekordot keressen, a Lighthouse automatikusan csinál egy adatbázis-lekérdezést itt.
    ): User @find

    "List multiple users."
     # több user lekérdezésére szolgáló lekérdezés, ahol a name mező alapján lehet szűrni, és SQL LIKE wildcards használhatók a keresésben. A @paginate direktíva pedig azt jelenti, hogy az eredményeket lapozható formában kapjuk vissza, alapértelmezettként 10 rekorddal oldalanként.
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}


"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}
type Post{
    id: ID!
    title: String!
    content: String!
    is_public: Boolean!
    author_id: ID!
    created_at: DateTime!
     updated_at: DateTime!
}
type Category{
    id: ID!
    name: String!
    color: String!
    created_at: DateTime!
     updated_at: DateTime!
}

