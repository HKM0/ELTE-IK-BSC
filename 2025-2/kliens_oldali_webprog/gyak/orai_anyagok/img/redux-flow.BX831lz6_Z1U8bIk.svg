<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#63b3ed"/>
    </marker>
    <marker id="arrow-faded" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#68d391"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" rx="12" fill="#0f1117"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">A Redux adatfolyam</text>

  <!-- ── STORE box ── -->
  <rect x="220" y="60" width="200" height="70" rx="10" fill="#1a2744" stroke="#63b3ed" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#90cdf4">Store</text>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#718096">{ cart: { items: [] } }</text>

  <!-- ── REDUCER box ── -->
  <rect x="220" y="190" width="200" height="70" rx="10" fill="#1a2a1a" stroke="#68d391" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#9ae6b4">Reducer</text>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="#718096">addItem(state, action)</text>

  <!-- ── ACTION box ── -->
  <rect x="220" y="320" width="200" height="70" rx="10" fill="#2d1b1b" stroke="#fc8181" stroke-width="2"/>
  <text x="320" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#fc8181">Action</text>
  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#718096">{ type, payload }</text>

  <!-- ── Arrow: Store → Reducer ── -->
  <line x1="320" y1="130" x2="320" y2="186" stroke="#63b3ed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Arrow: Reducer → Action ── -->
  <line x1="320" y1="260" x2="320" y2="316" stroke="#63b3ed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Arrow: Reducer → Store (left loop) ── -->
  <path d="M 220 225 Q 100 225 100 95 Q 100 60 218 60" fill="none" stroke="#68d391" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="82" y="148" text-anchor="middle" font-size="11" fill="#68d391">frissíti</text>
  <text x="82" y="163" text-anchor="middle" font-size="11" fill="#68d391">a store-t</text>

  <!-- ── Component box (right) dispatches action ── -->
  <rect x="490" y="320" width="160" height="70" rx="10" fill="#2d2218" stroke="#f6ad55" stroke-width="2"/>
  <text x="570" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#f6ad55">Komponens</text>
  <text x="570" y="372" text-anchor="middle" font-size="12" fill="#e2e8f0">dispatch(addItem(...))</text>

  <!-- ── Arrow: Component → Action ── -->
  <line x1="490" y1="355" x2="424" y2="355" stroke="#f6ad55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Faded: useSelector arrow (next lesson) ── -->
  <line x1="420" y1="95" x2="486" y2="95" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-faded)"/>
  <rect x="488" y="60" width="160" height="70" rx="10" fill="#1a1a1a" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="568" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#4a5568">useSelector</text>
  <text x="568" y="111" text-anchor="middle" font-size="10" fill="#4a5568" font-style="italic">következő óra</text>

</svg>
